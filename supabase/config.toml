project_id = "task-register"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# Maps to GOTRUE_EXTERNAL_EMAIL_ENABLED: turning this off disables password
# login too. Self-service signup is blocked by [auth] enable_signup instead.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.create-vendor]
verify_jwt = true

[functions.manage-vendor]
verify_jwt = true
